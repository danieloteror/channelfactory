[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-factory"
version = "0.1.0"
description = "Fábrica de canales explicativos en inglés: investigación, producción, clips (Clip Master) y publicación (Metricool)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "numpy>=1.26",
  "pillow>=10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
tts = ["kokoro-onnx>=0.4"]
asr = ["sherpa-onnx>=1.10"]
svg = ["cairosvg>=2.7"]
analysis = [
  "scenedetect>=0.6",
  "opencv-python-headless>=4.9",
  "librosa>=0.10",
  "yt-dlp>=2025.1.1",
]
# silero-vad: instalar con `pip install silero-vad --no-deps` (usamos su ONNX con onnxruntime, sin torch)
storage = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
channel-factory = "channel_factory.cli:app"

[tool.setuptools.packages.find]
include = ["channel_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
channel_factory = ["templates/*.yaml", "clip_master_adapter/profiles/*.yaml"]
